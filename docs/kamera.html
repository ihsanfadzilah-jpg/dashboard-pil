<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamera + ML - Jarak Layar</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.stage{position:relative}
video,canvas{width:100%;border-radius:12px;display:block}
canvas{position:absolute;inset:0}
.badge{margin-top:12px;padding:14px;border-radius:12px;font-size:1.3rem;text-align:center;font-weight:700}
.aman{background:#166534}.waspada{background:#a16207}.dekat{background:#991b1b}.idle{background:#334155}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
a{color:#7dd3fc}
</style>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
</head>
<body><div class="wrap">
<h2>Jarak Layar ke Mata (Kamera + Machine Learning)</h2>
<div class="stage"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<div id="badge" class="badge idle">Memuat model...</div>
<div class="row">
  <button id="btnTrain">Mulai rekam sampel latih</button>
  <button id="btnReset">Reset model</button>
</div>
<p id="info"></p>
<p><a href="index.html">Kembali ke dashboard</a></p>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const CFG = {
  BROKER_URL: "wss://broker.hivemq.com:8884/mqtt",   // samakan dengan alamat broker di js/config.js
  TOPIK_SENSOR: "ihsan-pil/jaraklayar/data",
  TOPIK_KAMERA: "ihsan-pil/jaraklayar/kamera",
  KEYS: ["jarak"],
  SAFE_CM: 55,    // di atas ini AMAN
  WARN_CM: 35,    // 35 sampai 55 WASPADA, di bawah 35 TERLALU DEKAT
  POST_EVERY_MS: 500,
  SENSOR_STALE_MS: 5000
};

const v = document.getElementById("v"), c = document.getElementById("c"), ctx = c.getContext("2d");
const badge = document.getElementById("badge"), info = document.getElementById("info");

// --- MQTT: baca sensor, kirim hasil kamera ---
let sensorCm = null, lastSensorAt = 0;
const pick = o => { for (const k of CFG.KEYS) if (typeof o[k] === "number") return o[k]; return null; };
const mq = mqtt.connect(CFG.BROKER_URL, { clientId: "kamera-" + Math.random().toString(16).slice(2, 8) });
mq.on("connect", () => mq.subscribe(CFG.TOPIK_SENSOR));
mq.on("message", (_t, m) => {
  try { const d = pick(JSON.parse(m.toString())); if (d != null) { sensorCm = d; lastSensorAt = Date.now(); } } catch {}
});

// --- Model wajah ---
const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
const lm = await FaceLandmarker.createFromOptions(fs, {
  baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
  runningMode: "VIDEO", numFaces: 1
});
v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
await v.play();
c.width = v.videoWidth; c.height = v.videoHeight;

// --- Regresi: jarak = a * (1/ipd) + b, label dari sensor HC-SR04 ---
let S = JSON.parse(localStorage.getItem("samples") || "[]"), W = null;
function fit() {
  if (S.length < 8) return;
  const n = S.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const [x, y] of S) { sx += x; sy += y; sxx += x * x; sxy += x * y; }
  const den = n * sxx - sx * sx; if (Math.abs(den) < 1e-12) return;
  const a = (n * sxy - sx * sy) / den; W = { a, b: (sy - a * sx) / n };
}
fit();
const predict = ipd => (W ? W.a / ipd + W.b : null);
const ipdPx = f => Math.hypot((f[468].x - f[473].x) * v.videoWidth, (f[468].y - f[473].y) * v.videoHeight);
const label = d => d == null ? "idle" : d >= CFG.SAFE_CM ? "aman" : d >= CFG.WARN_CM ? "waspada" : "dekat";
const text = {
  aman: "AMAN",
  waspada: "WASPADA - mulai terlalu dekat",
  dekat: "TERLALU DEKAT - mundur",
  idle: "Wajah belum terdeteksi / model belum dilatih"
};

let training = false, lastPost = 0, lastSample = 0;
document.getElementById("btnTrain").onclick = e => {
  training = !training;
  e.target.textContent = training ? "Hentikan rekam sampel" : "Mulai rekam sampel latih";
};
document.getElementById("btnReset").onclick = () => { S = []; W = null; localStorage.removeItem("samples"); };

function loop() {
  const res = lm.detectForVideo(v, performance.now());
  ctx.clearRect(0, 0, c.width, c.height);
  const sCm = (Date.now() - lastSensorAt < CFG.SENSOR_STALE_MS) ? sensorCm : null;
  let camCm = null;

  if (res.faceLandmarks.length) {
    const f = res.faceLandmarks[0], ipd = ipdPx(f);
    for (const i of [468, 473]) {
      ctx.beginPath(); ctx.arc(f[i].x * c.width, f[i].y * c.height, 4, 0, 7);
      ctx.fillStyle = "#38bdf8"; ctx.fill();
    }
    // data latih hanya dari rentang jarak yang masuk akal (abaikan 200 cm saat tidak ada orang)
    if (training && sCm != null && sCm >= 15 && sCm <= 120 && performance.now() - lastSample > 200) {
      S.push([1 / ipd, sCm]); if (S.length > 600) S.shift();
      lastSample = performance.now(); fit(); localStorage.setItem("samples", JSON.stringify(S));
    }
    camCm = predict(ipd);
  }

  const st = label(sCm ?? camCm);
  badge.className = "badge " + st; badge.textContent = text[st];
  info.textContent = `Sensor: ${sCm ?? "-"} cm | Kamera (ML): ${camCm ? camCm.toFixed(1) : "-"} cm | Sampel latih: ${S.length}`;

  if (mq.connected && performance.now() - lastPost > CFG.POST_EVERY_MS) {
    lastPost = performance.now();
    mq.publish(CFG.TOPIK_KAMERA, JSON.stringify({ ts: Date.now(), camera_cm: camCm, sensor_cm: sCm, status: st, samples: S.length }));
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
